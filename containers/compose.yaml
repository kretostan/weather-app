services:
  backend:
    build:
      context: ..
      dockerfile: containers/Dockerfile.backend
      target: prod
    env_file:
      - ../backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ..
      dockerfile: containers/Dockerfile.frontend
      target: prod
    ports:
      - "8080:80"
    volumes:
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
